<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xandria AI</title>
 <link rel="stylesheet" href="./styles.css" />
  <style>
    /* fallback if CSS file fails to load */
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #ffffff;
      color: #000000;
      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body>
  <!-- HEADER -->
<header class="header">
  <img src="${logoUri}" alt="XandriaAI Logo" class="logo" />
  <h1>XandriaAI:</h1>
  <span class="subtle">Your AI-powered code snippet generator</span>
</header>


  <!-- MAIN CONTENT -->
  <div class="container">
    <!-- Input Section -->
    <section class="card">
      <label class="field-label" for="codeInput">Input Code</label>
      <textarea id="codeInput" placeholder="Paste your code here..."></textarea>
      
      <div class="row">
        <div class="btn-group">
          <button id="generate" class="btn primary">
            <i class="codicon codicon-play"></i> Generate
          </button>
          <button id="clear" class="btn">
            <i class="codicon codicon-trash"></i> Clear
          </button>
        </div>
        <div id="status" class="status" aria-live="polite"></div>
      </div>
    </section>

    <!-- Output Section -->
    <section class="card">
      <div class="card-header">
        <span>Output</span>
        <div class="tools">
          <button id="copy" class="icon-btn" title="Copy to Clipboard">
            📋
          </button>
        </div>
      </div>
      <pre id="output" class="output">💡 Press "Generate" to create a snippet!</pre>
    </section>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast" hidden>
    <i class="codicon codicon-info"></i>
    <span id="toastText"></span>
  </div>

  <!-- JS SCRIPT -->
  <script>
    const vscode = acquireVsCodeApi();

// Handle Generate button
document.getElementById("generate").addEventListener("click", () => {
  const codeInput = document.getElementById("codeInput").value.trim();
  const status = document.getElementById("status");

  if (!codeInput) {
    // If empty, show a toast (non-blocking, pretty)
    showToast("⚠️ Please paste or type code before generating!");
    status.textContent = "No input provided.";
    return; // stop here
  }

  // If code is present, continue normally
  vscode.postMessage({ command: "getSnippet" });
  status.textContent = "Generating...";
});


    // Handle Clear button
    document.getElementById("clear").addEventListener("click", () => {
      document.getElementById("codeInput").value = "";
      document.getElementById("output").textContent = '💡 Press "Generate" to create a snippet!';
      document.getElementById("status").textContent = "";
    });

    // Handle Copy button
    document.getElementById("copy").addEventListener("click", async () => {
      try {
        const text = document.getElementById("output").textContent;
        await navigator.clipboard.writeText(text);
        showToast("Copied to clipboard!");
      } catch {
        showToast("Copy failed");
      }
    });

    // Listen for messages from VSCode
    window.addEventListener("message", (event) => {
      const { command, snippet, payload } = event.data;
      const output = document.getElementById("output");
      const status = document.getElementById("status");

      if (command === "displaySnippet") {
        output.textContent = snippet || "No snippet received.";
        status.textContent = "Done.";
      } else if (command === "displayFormatted") {
        output.textContent = JSON.stringify(payload, null, 2);
        status.textContent = "Done.";
      }
    });

    // Toast notification
    function showToast(msg) {
      const toast = document.getElementById("toast");
      const toastText = document.getElementById("toastText");
      toastText.textContent = msg;
      toast.hidden = false;
      toast.style.opacity = "1";
      setTimeout(() => {
        toast.style.opacity = "0";
        setTimeout(() => (toast.hidden = true), 300);
      }, 1800);
    }
  </script>
</body>
</html>
