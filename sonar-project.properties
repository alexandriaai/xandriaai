sonar.projectKey=xandriaai
sonar.projectName=xandriaai
sonar.projectVersion=1.0
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8

# Sources
sonar.sources=src,server

# Tests
sonar.tests=src/test
sonar.test.inclusions=**/*.test.js,**/*.spec.ts,**/*.test.ts,**/*.spec.js

# Coverage reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.python.coverage.reportPaths=coverage.xml

# Exclude auto-generated & irrelevant files from SonarQube analysis
sonar.exclusions=coverage/**, venv/**, node_modules/**, out/**
