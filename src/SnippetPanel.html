<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xandria AI</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 1rem;
      background-color: #1e1e1e;
      color: #ffffff;
    }

    #snippetBox {
      width: 100%;
      min-height: 150px;
      background: #333;
      padding: 10px;
      border: 1px solid #555;
      border-radius: 4px;
      color: white;
      white-space: pre-wrap;
      margin-top: 1rem;
    }

    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      background-color: #2d2d2d;
      color: white;
      border: 1px solid #555;
      border-radius: 4px;
    }

    button {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      background-color: #007acc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #005f99;
    }

    .feedback-buttons {
      margin-top: 1rem;
    }

    .feedback-buttons button {
      margin-right: 0.5rem;
    }
  </style>
</head>
<body>
  <h1>Code Snippet Generator</h1>

  <!-- Optional input area -->
  <textarea id="codeInput" placeholder="Paste code here (optional, not used yet)"></textarea>

  <!-- Response display area -->
  <div id="snippetBox">Press the button to generate a snippet...</div>

  <!-- Generate snippet -->
  <button id="generateSnippet">Generate Snippet</button>

  <script>
    const vscode = acquireVsCodeApi();

    document.getElementById('generateSnippet').addEventListener('click', () => {
      vscode.postMessage({ command: 'getSnippet' });
    });

    window.addEventListener('message', (event) => {
      const message = event.data;
      const display = document.getElementById('snippetBox');

      if (message.command === 'displaySnippet') {
        display.innerHTML = `
          <pre><code>${message.snippet}</code></pre>
          <div class="feedback-buttons">
            <button onclick="sendFeedback('👍')">👍</button>
            <button onclick="sendFeedback('👎')">👎</button>
          </div>
        `;
      }

      // ✅ Handle formatted JSON display
      else if (message.command === 'displayFormatted') {
        display.innerHTML = `
          <h3>Formatted Response</h3>
          <pre><code>${JSON.stringify(message.payload, null, 2)}</code></pre>
        `;
      }
    });

    function sendFeedback(value) {
      vscode.postMessage({
        command: 'feedback',
        value: value
      });
    }
  </script>
</body>
</html>
